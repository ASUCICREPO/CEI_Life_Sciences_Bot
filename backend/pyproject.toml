[project]
name = "cei-life-sciences-agents"
version = "0.1.0"
description = "Multi-agent life sciences assistant using LangGraph"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-aws>=1.2",
    "langchain-aws>=0.3",
    "langchain-core>=0.3",
    "jinja2>=3.1",
    "boto3>=1.35",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
