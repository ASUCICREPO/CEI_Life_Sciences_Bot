version: 0.2

# Build and test the selected source revision without deploying or changing AWS resources.
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - cd "$CODEBUILD_SRC_DIR/backend" && npm ci
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm ci
      - python3 -m pip install --quiet uv
      - cd "$CODEBUILD_SRC_DIR/backend/agents" && uv sync --frozen
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm test
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm run build
      - cd "$CODEBUILD_SRC_DIR/backend" && npm run build
      - cd "$CODEBUILD_SRC_DIR/backend" && npm test -- --runInBand
      - cd "$CODEBUILD_SRC_DIR/backend/agents" && AWS_EC2_METADATA_DISABLED=true .venv/bin/python -m pytest tests -q
      - cd "$CODEBUILD_SRC_DIR/backend/lambdas/ncbi" && AWS_EC2_METADATA_DISABLED=true ../../agents/.venv/bin/python -m pytest test_handler.py test_targets.py test_limiter.py -q
      - cd "$CODEBUILD_SRC_DIR/backend/agents" && AWS_EC2_METADATA_DISABLED=true .venv/bin/python -m pytest ../lambdas/spikes/b99_identity/test_interceptor.py ../lambdas/session-router/tests/test_classifier.py ../lambdas/delete-worker/test_handler.py -q
      - cd "$CODEBUILD_SRC_DIR/backend/lambdas/jobs-handler" && AWS_EC2_METADATA_DISABLED=true ../../agents/.venv/bin/python -m pytest tests -q
      - cd "$CODEBUILD_SRC_DIR/backend/lambdas/watchdog" && AWS_EC2_METADATA_DISABLED=true ../../agents/.venv/bin/python -m pytest tests -q
      - cd "$CODEBUILD_SRC_DIR/backend/agents" && AWS_EC2_METADATA_DISABLED=true .venv/bin/python -m pytest ../lambdas/token-refresh/tests -q
      - cd "$CODEBUILD_SRC_DIR/backend/scripts/spikes" && AWS_EC2_METADATA_DISABLED=true ../../agents/.venv/bin/python -m pytest test_b99_identity_test.py -q
      - docker build -t cei-lsops-verify "$CODEBUILD_SRC_DIR/backend/lambdas/lsops"
      - docker run --rm --entrypoint python cei-lsops-verify -c "import Bio, rdkit, primer3, hgvs.parser"
      - docker run --rm --entrypoint python cei-lsops-verify -c "from lab_calculations import dilution; assert dilution(10, 2, 5)['stock_volume'] == 1"
